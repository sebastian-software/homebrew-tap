name: Update mdtheme formula

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-tap-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.download.outputs.changed }}
      formula_sha: ${{ steps.candidate.outputs.formula_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the latest native formula
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo sebastian-software/mdtheme --json tagName --jq .tagName)
          if [[ ! "$tag" =~ ^mdtheme-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "No stable native release found."
            exit 0
          fi
          # The release may exist while its binaries are still being built.
          assets=$(gh release view "$tag" --repo sebastian-software/mdtheme --json assets --jq '.assets[].name')
          if ! printf '%s\n' "$assets" | grep -Fx mdtheme.rb > /dev/null; then
            echo "Release artifacts are not ready yet."
            exit 0
          fi
          gh release download "$tag" --repo sebastian-software/mdtheme --pattern mdtheme.rb --dir "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/mdtheme.rb" Formula/mdtheme.rb
          if git diff --quiet -- Formula/mdtheme.rb && git ls-files --error-unmatch Formula/mdtheme.rb > /dev/null 2>&1; then
            echo "Formula is already current."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Commit the candidate locally
        id: candidate
        if: steps.download.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.download.outputs.tag }}
        run: bash .github/scripts/prepare_mdtheme_candidate.sh "$RELEASE_TAG"
      - name: Register tap
        if: steps.download.outputs.changed == 'true'
        run: brew tap --custom-remote sebastian-software/tap "file://$GITHUB_WORKSPACE"
      - name: Validate and install mdtheme
        if: steps.download.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.download.outputs.tag }}
          FORMULA_SHA: ${{ steps.candidate.outputs.formula_sha }}
          CANDIDATE_HEAD: ${{ steps.candidate.outputs.candidate_head }}
        run: bash .github/scripts/verify_mdtheme_candidate.sh "$RELEASE_TAG" "$FORMULA_SHA" "$CANDIDATE_HEAD"
      - name: Save verified formula
        if: steps.download.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdtheme-formula
          path: verified/mdtheme.rb
          retention-days: 1

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mdtheme-formula
          path: Formula
      - name: Commit verified formula without executing it
        env:
          FORMULA_SHA: ${{ needs.update.outputs.formula_sha }}
        run: |
          test "$(shasum -a 256 Formula/mdtheme.rb | cut -d ' ' -f 1)" = "$FORMULA_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Formula/mdtheme.rb
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = Formula/mdtheme.rb
          git commit -m "Update verified mdtheme formula"
          git push
