name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test formula
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check formula trust boundaries
        run: bash .github/scripts/test_ci_formula_trust.sh
      - name: Register tap
        run: brew tap --custom-remote sebastian-software/tap "file://$GITHUB_WORKSPACE"
      - name: Validate formula
        run: |
          brew style Formula/*.rb
          bash .github/scripts/trust_ci_formula.sh dalo
          brew audit --strict --online sebastian-software/tap/dalo
      - name: Install and test Dalo
        run: |
          brew install sebastian-software/tap/dalo
          brew test sebastian-software/tap/dalo
          dalo --version
      - name: Install and test mdtheme
        if: hashFiles('Formula/mdtheme.rb') != ''
        run: |
          bash .github/scripts/trust_ci_formula.sh mdtheme
          brew audit --strict --online sebastian-software/tap/mdtheme
          brew install sebastian-software/tap/mdtheme
          brew test sebastian-software/tap/mdtheme
          mdtheme --version
